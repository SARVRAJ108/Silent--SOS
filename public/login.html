<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Silent SOS</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo-section">

            <div class="logo-icon">
                🛡️
            </div>

            <div>
                <h2>Silent SOS</h2>
                <p>Your Safety, Our Priority.</p>
            </div>

        </div>


        <div class="nav-buttons">

            <a href="index.html">
                Home
            </a>

            <a href="register.html" class="register-btn">
                Register
            </a>

        </div>

    </nav>


    <!-- Login Section -->

    <main class="auth-page">

        <div class="auth-container">


            <!-- Login Form -->

            <section class="auth-card">

                <div class="auth-heading">

                    <div class="auth-icon">
                        🛡️
                    </div>

                    <h1>Welcome Back</h1>

                    <p>
                        Login to access your Silent SOS dashboard.
                    </p>

                </div>


                <form id="loginForm">


                    <div class="form-group">

                        <label for="loginEmail">
                            Email or Mobile Number
                        </label>

                        <input
                            type="text"
                            id="loginEmail"
                            placeholder="Enter email or mobile number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <div class="form-options">

                        <label class="remember-option">

                            <input
                                type="checkbox"
                                id="rememberMe"
                            >

                            <span>
                                Remember me
                            </span>

                        </label>


                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Login
                    </button>


                </form>


                <div class="auth-footer">

                    <p>
                        Don't have an account?
                        <a href="register.html">
                            Register
                        </a>
                    </p>

                </div>


            </section>


            <!-- Safety Message -->

            <section class="auth-message">

                <div class="message-icon">
                    🚨
                </div>

                <h2>
                    Your Safety Matters
                </h2>

                <p>
                    Login once and keep your emergency
                    contacts ready for when you need them.
                </p>

            </section>


        </div>

    </main>


    <script src="js/auth.js"></script>

</body>

</html>
